# ── H2 File-Based Database (persistent during dev) ─────────────────────────
spring.datasource.url=jdbc:h2:file:./data/localservicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.admin.email=sanjay456@urbancompany.com
app.admin.password=Sanjay@8792
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Jackson (handle LocalDateTime) ───────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ── Twilio SMS Configuration ──────────────────────────────────────────────────
# Register for free account at https://www.twilio.com/console
# Replace these with your actual Twilio credentials
# Get these values from: https://www.twilio.com/console/account/settings/general

# Option 1: Use environment variables (RECOMMENDED for production)
# Set in your system environment before running the application
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# Option 2: Uncomment below for DEVELOPMENT ONLY (never commit to git!)
# ⚠️  DO NOT use in production - use environment variables instead
# twilio.account.sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# twilio.auth.token=your_auth_token_here
# twilio.phone.number=+1234567890

# Steps to get your phone number:
# 1. Go to https://www.twilio.com/console/phone-numbers/incoming
# 2. Click "Get your first Twilio phone number" (or "Buy a number")
# 3. Accept the suggested number or search for one
# 4. Copy the phone number (format: +1234567890)
# 5. Add it here or set as environment variable TWILIO_PHONE_NUMBER
